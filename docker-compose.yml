version: '3.8'

services:
  neo4j:
    image: neo4j:5.10  # Example: Change from 5.11 to 5.10 (or a GDS-supported version)
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/your_password
      - NEO4J_PLUGINS=["apoc","graph-data-science"]
      - NEO4J_EDITION=community
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins
      - movies_init:/docker-entrypoint-initdb.d

  devcontainer:
    container_name: info-5940-devcontainer
    build:
      dockerfile: Dockerfile
      target: devcontainer
    environment:
      OPENAI_API_KEY: <API_KEY>
      OPENAI_BASE_URL: https://api.ai.it.cornell.edu/
      TZ: America/New_York
    volumes:
      - '$HOME/.aws:/root/.aws'
      - '.:/workspace'
    depends_on:
      - neo4j

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  movies_init:
